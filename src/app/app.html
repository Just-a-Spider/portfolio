<!-- Sticky Top Navigation Bar -->
<app-navbar 
  [t]="t()" 
  [currentLang]="currentLang()" 
  [activeSection]="activeSection()" 
  [isScrolled]="isScrolled()" 
  [profile]="profile" 
  (langChanged)="setLang($event)" 
  (sectionSelected)="scrollToSection($event)" />

<!-- Main Portfolio Layout -->
<main>
  <!-- Hero Section with Gaze & Animated Blobatar -->
  <app-hero 
    [t]="t()" 
    [currentLang]="currentLang()" 
    [profile]="profile" 
    (viewProjects)="scrollToSection('projects')" 
    (copyEmail)="copyEmail()" 
    (expressionChanged)="showToast('Avatar expression: ' + $event)" />

  <div class="section-divider"></div>

  <!-- Interactive Component Sandbox for @just-a-spider/blobatar-ng -->
  <app-playground 
    [t]="t()" 
    [currentLang]="currentLang()" 
    (toast)="showToast($event)" />

  <div class="section-divider"></div>

  <!-- Featured Flagships (Tier 1) & Supporting Systems (Tier 2) -->
  <app-projects 
    [t]="t()" 
    [projects]="projects()" 
    [selectedCategory]="selectedCategory()" 
    (categoryChanged)="setCategory($event)" 
    (openModal)="openProjectModal($event)" />

  <div class="section-divider"></div>

  <!-- Technical Competencies & Tooling -->
  <app-skills 
    [t]="t()" 
    [skillCategories]="skillCategories()" />

  <div class="section-divider"></div>

  <!-- Career Trajectory, Academic Standing & Honors -->
  <app-experience 
    [t]="t()" 
    [experiences]="experiences()" 
    [recognitions]="recognitions()" />

  <div class="section-divider"></div>

  <!-- Contact & Global Footer -->
  <app-contact 
    [t]="t()" 
    [profile]="profile" 
    (emailCopied)="copyEmail()" />
</main>

<!-- Project Architecture Deep Dive Modal -->
<app-modal 
  [project]="selectedProject()" 
  [t]="t()" 
  (closeModal)="closeProjectModal()" />

<!-- Toast Notification Feedback -->
@if (toastMessage()) {
  <div class="toast-notification font-mono">
    <i class="fas fa-check-circle text-emerald"></i>
    <span>{{ toastMessage() }}</span>
  </div>
}
