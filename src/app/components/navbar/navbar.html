<header class="navbar" [class.scrolled]="isScrolled()">
  <div class="nav-container">
    <a (click)="onSelectSection('overview')" class="nav-logo" role="button" tabindex="0">
      <span class="logo-accent">&gt;_</span>
      <span class="logo-text">andre<span class="text-accent">.dev</span></span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nav-links">
      <button 
        class="nav-link-btn" 
        [class.active]="activeSection() === 'overview'"
        (click)="onSelectSection('overview')">
        {{ t().nav.overview }}
      </button>
      <button 
        class="nav-link-btn" 
        [class.active]="activeSection() === 'about'"
        (click)="onSelectSection('about')">
        {{ t().nav.about }}
      </button>
      <button 
        class="nav-link-btn" 
        [class.active]="activeSection() === 'projects'"
        (click)="onSelectSection('projects')">
        {{ t().nav.projects }}
      </button>
      <button 
        class="nav-link-btn" 
        [class.active]="activeSection() === 'skills'"
        (click)="onSelectSection('skills')">
        {{ t().nav.skills }}
      </button>
      <button 
        class="nav-link-btn" 
        [class.active]="activeSection() === 'experience'"
        (click)="onSelectSection('experience')">
        {{ t().nav.experience }}
      </button>
      <button 
        class="nav-link-btn" 
        [class.active]="activeSection() === 'contact'"
        (click)="onSelectSection('contact')">
        {{ t().nav.contact }}
      </button>
    </nav>

    <!-- Header Actions -->
    <div class="nav-actions">
      <!-- Language Switcher -->
      <div class="lang-switch">
        <button 
          class="lang-pill" 
          [class.active]="currentLang() === 'en'" 
          (click)="onSelectLang('en')">EN</button>
        <button 
          class="lang-pill" 
          [class.active]="currentLang() === 'es'" 
          (click)="onSelectLang('es')">ES</button>
      </div>

      <!-- CV Download Button -->
      <a 
        [href]="getResumeLink()" 
        target="_blank" 
        download 
        class="btn btn-secondary btn-sm nav-cv-btn">
        <i class="fas fa-file-pdf"></i>
        <span>{{ t().nav.downloadCv }}</span>
      </a>

      <!-- Social Links -->
      <div class="nav-socials">
        <a [href]="profile().github" target="_blank" rel="noopener noreferrer" class="social-icon" title="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a [href]="profile().linkedin" target="_blank" rel="noopener noreferrer" class="social-icon" title="LinkedIn">
          <i class="fab fa-linkedin"></i>
        </a>
        <a [href]="profile().npmBlobatar" target="_blank" rel="noopener noreferrer" class="social-icon" title="NPM Package">
          <i class="fab fa-npm"></i>
        </a>
      </div>

      <!-- Mobile Menu Toggle -->
      <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <i class="fas" [class.fa-bars]="!mobileMenuOpen()" [class.fa-times]="mobileMenuOpen()"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  @if (mobileMenuOpen()) {
    <div class="mobile-menu fade-in-up">
      <button class="mobile-nav-link" (click)="onSelectSection('overview')">{{ t().nav.overview }}</button>
      <button class="mobile-nav-link" (click)="onSelectSection('about')">{{ t().nav.about }}</button>
      <button class="mobile-nav-link" (click)="onSelectSection('projects')">{{ t().nav.projects }}</button>
      <button class="mobile-nav-link" (click)="onSelectSection('skills')">{{ t().nav.skills }}</button>
      <button class="mobile-nav-link" (click)="onSelectSection('experience')">{{ t().nav.experience }}</button>
      <button class="mobile-nav-link" (click)="onSelectSection('contact')">{{ t().nav.contact }}</button>
      <div class="mobile-menu-divider"></div>
      <a [href]="getResumeLink()" target="_blank" class="btn btn-primary btn-sm" style="width: 100%;">
        <i class="fas fa-file-pdf"></i> {{ t().nav.downloadCv }}
      </a>
    </div>
  }
</header>
